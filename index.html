    <!-- Тема применяется до отрисовки, иначе при тёмном выборе страница
         успевает мигнуть светлым. Ключ должен совпадать с THEME_STORAGE_KEY
         в src/lib/theme.ts, значение — с токенами --paper в src/index.css. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('meridian-theme');
          /* Тот же набор значений, что в isTheme() из src/lib/theme.ts */
          var choice =
            stored === 'light' || stored === 'dark' || stored === 'system'
              ? stored
              : 'system';
          var dark =
            choice === 'dark' ||
            (choice !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          root.classList.toggle('dark', dark);
          root.dataset.theme = choice;
          root.dataset.themeResolved = dark ? 'dark' : 'light';
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', dark ? '#12141a' : '#f5f4f1');
        } catch (e) {
          /* Хранилище недоступно — остаётся тема по умолчанию из CSS */
        }
      })();
    </script>
